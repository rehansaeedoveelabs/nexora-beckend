# Nexora app configuration. Uploaded to Shopify with `shopify app deploy`.
# Safe to commit: contains the public client_id, no secret.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "687747fff1ba6b2a7bfcccdfde55f410"
name = "Nexora"
embedded = true

# The embedded app UI (the React frontend). For local dev this is a tunnel to the Vite dev server;
# `automatically_update_urls_on_dev` rewrites it while `shopify app dev` runs.
application_url = "https://kim-presence-measuring-carnival.trycloudflare.com"

[access_scopes]
# Requested scopes support locations, orders, inventory-aware routing and checkout constraints.
scopes = "read_locations,read_products,read_orders,read_inventory,read_third_party_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_fulfillment_constraint_rules"
# Token exchange (managed install) — no OAuth redirect dance.
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://kim-presence-measuring-carnival.trycloudflare.com/api/auth" ]

[webhooks]
api_version = "2026-10"

  # All webhooks hit the backend's single verified endpoint; the controller dispatches by topic.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled", "app/scopes_update" ]
  uri = "https://kim-presence-measuring-carnival.trycloudflare.com/api/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://kim-presence-measuring-carnival.trycloudflare.com/api/webhooks"

  [[webhooks.subscriptions]]
  topics = [
    "locations/create",
    "locations/update",
    "locations/delete",
    "locations/activate",
    "locations/deactivate",
  ]
  uri = "https://kim-presence-measuring-carnival.trycloudflare.com/api/webhooks"

  # Mandatory privacy/compliance webhooks (required for App Store review).
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://kim-presence-measuring-carnival.trycloudflare.com/api/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
