[package]
name = "routing-core"
version = "0.1.0"
edition = "2021"
description = "Shared routing logic for Nexora's Shopify Functions (ranking + product-rule eligibility)."

# The pure decision logic that the fulfillment-constraints and order-routing Functions will call.
# It is deliberately free of Shopify I/O so the same code is unit-tested against the backend's
# golden fixtures (tests/Fixtures/routing/cases.json) and reused by each Function's thin wrapper.

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
